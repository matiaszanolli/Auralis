[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "matchering-player"
version = "1.5.1"  # PEP 440 mirror of the auralis/version.py source of truth
description = "Professional-grade media player with real-time audio remastering capabilities"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Matías Zanolli" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Sound/Audio :: Players",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.14",
]
# Regenerated from requirements.txt in #4528, which is the de-facto source of
# truth (it carries a pip-compile header and vetted `==` pins). This list had
# drifted so far that `pip install -e .` produced an environment that could not
# import `auralis.library` at all — SQLAlchemy was simply absent.
#
# Floors are the pinned major/minor, NOT 2021-era values. Too-low floors are the
# inverse of a stale pin and just as harmful: a resolver could legally pick
# NumPy 1.x, where the removed `np.float`/`np.bool` aliases still exist and
# dtype promotion differs from the NumPy 2.x this DSP code was written against,
# or a pre-0.100 FastAPI with no Pydantic V2 and no `lifespan` — which
# auralis-web/backend/main.py requires.
#
# `requirements-pin-guard.yml` now diffs the name set here against
# requirements.txt on every PR, so this cannot silently re-diverge.
dependencies = [
    # Audio processing
    #
    # The `<2.5` CEILING is load-bearing, not tidiness. librosa and resampy both
    # pull numba, and numba 0.66 (the newest with cp314 wheels) requires
    # `numpy<2.5`. With an open-ended `numpy>=2.0` the resolver picks numpy
    # 2.5.1, then backtracks numba all the way to 0.53.1 — a 2021 release with
    # no numpy cap in its metadata and no wheel for Python 3.14 — and the
    # install dies building llvmlite 0.36 from source. Verified against a clean
    # 3.14 venv. requirements.txt's `numpy==2.3.5` sits inside this range.
    # Revisit when numba supports numpy 2.5.
    "numpy>=2.4,<2.5",
    "scipy>=1.18",
    "soundfile>=0.14",
    "librosa>=0.11",
    "resampy>=0.4",          # auralis/io/processing.py resampling path
    "mutagen>=1.48",         # tag reading/writing across the scanner + metadata router
    # Backend
    "fastapi>=0.141",
    # Extras must match both requirements manifests (#4561) — see the note
    # there on uvloop/httptools. The floor-vs-exact pinning divergence between
    # this file and requirements.txt is tracked separately by #4355.
    # >=0.52.1 (#4784): earlier versions never wire transport pause_writing/
    # resume_writing into a real event, so WebSocket sends never actually
    # suspend under backpressure — see requirements.txt's uvicorn comment.
    "uvicorn[standard]>=0.52.1",
    "pydantic>=2.13",
    # Imported directly (config/middleware.py, main.py, ws_handlers/messages.py):
    # BaseHTTPMiddleware, TrustedHostMiddleware, Request/Response, routing.Match,
    # WebSocketState. FastAPI re-exports only part of this, so it is a real
    # direct dependency, not just FastAPI's transitive — and it was declared
    # nowhere at all until #4871. FastAPI's own range is open-ended
    # (`starlette>=0.46.0`, no cap), so leaving it undeclared let a fresh
    # resolve pick any newer major.
    "starlette>=1.3.1",
    # No import anywhere, but load-bearing: FastAPI raises at request time on
    # the `UploadFile`/`File(...)` endpoints in routers/files.py without it.
    "python-multipart>=0.0.32",
    # Database
    "SQLAlchemy>=2.0.51",       # auralis/library/** — models, 14 repositories, migrations
    # Supporting
    "pillow>=12.3",          # artwork thumbnail endpoint (#4447)
    "aiohttp>=3.14.3",         # artwork fetching
    "psutil>=7.2",           # system router
]

[project.optional-dependencies]
dev = [
    # Upper bound REMOVED in #4529. It was load-bearing under #4559 because
    # tests/conftest.py used the legacy pytest_ignore_collect(path, config)
    # hook signature that pytest 9.1 removed; that hook has since been deleted
    # (it guarded 8 files that no longer exist) and the four markers 9.1
    # rejects under --strict-markers are now declared in pytest.ini.
    # Verified: `pytest --collect-only tests/` succeeds on 9.1.1. The floor
    # mirrors minversion in pytest.ini.
    "pytest>=9.0.1",
    "pytest-asyncio>=0.17.0",
    "pytest-cov>=3.0.0",
    "pytest-timeout>=2.4",
    # Moved out of [project.dependencies] in #4528 — each of these has zero
    # importers in auralis/ or auralis-web/ and is reached only from tests:
    #   sounddevice -> tests/conftest.py::_ensure_portaudio
    #   websockets  -> tests/integration/test_phase4_player_workflow.py
    #   httpx       -> direct AsyncClient/ASGITransport test call sites
    #   httpx2      -> Starlette 1.x TestClient's maintained transport
    "sounddevice>=0.4.5",
    "websockets>=10.0",
    "httpx>=0.28",
    "httpx2>=2.9",
    "black>=22.0.0",
    "isort>=5.10.0",
    "mypy>=0.950",
    "pylint>=2.14.0",
    "pre-commit>=2.17.0",
]

[tool.black]
line-length = 88
target-version = ["py314"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
pretty = true
show_error_codes = true
show_error_context = true

# Core library type checking (strict)
[[tool.mypy.overrides]]
module = "auralis.*"
strict = true

# Backend services type checking (strict - our new code)
[[tool.mypy.overrides]]
module = "auralis-web.backend.services.*"
strict = true

# Backend cache type checking (strict)
[[tool.mypy.overrides]]
module = "auralis-web.backend.cache.*"
strict = true

# Optional: Gradual typing for other backend modules (less strict during migration)
[[tool.mypy.overrides]]
module = "auralis-web.backend.*"
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.hatch.build.targets.wheel]
packages = ["auralis"]

[tool.mutmut]
paths_to_mutate = "auralis/library/cache.py"
tests_dir = "tests/mutation/"
runner = "python -m pytest -x --tb=short"

# Pytest configuration is defined in pytest.ini (takes precedence over pyproject.toml)
