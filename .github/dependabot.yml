# Keeps the commit-SHA action pins from silently going stale (#4868).
#
# Every `uses:` in .github/workflows/ is pinned to an immutable commit SHA with
# a `# vX.Y.Z` comment. That closes the "upstream re-points a tag" hole, but it
# also means a pinned action never receives upstream security fixes on its own.
# Dependabot is the other half of that trade: it opens a PR when a newer release
# exists, rewriting both the SHA and the version comment together.
#
# Scope is deliberately narrow — github-actions for version updates. The
# Python/npm/cargo manifests here are governed by their own guards
# (requirements-pin-guard.yml, lockfile-guard.yml, rust-audit.yml) and by the
# deliberate `numpy<2.5` ceiling, so letting Dependabot raise those would fight
# existing policy rather than support it.
#
# The one exception is /desktop: Electron ships Chromium and the update channel,
# and an advisory against it (GHSA-jr5w-w6x2-84p9) sat unflagged because nothing
# watched that manifest (#6152). Security updates alone were not enough either:
# Chromium/V8 backports land as Electron patch releases with no advisory, and the
# lock sat seven patches behind (#6519). So /desktop gets version updates too:
# patch and minor bumps as one grouped PR, a new major on its own, since it needs
# a smoke test of the packaged app.
version: 2
updates:
  - package-ecosystem: "github-actions"
    # Dependabot reads composite actions only from the directories it is told
    # about, so the one under .github/actions/ is listed (#6657).
    directories:
      - "/"
      - "/.github/actions/build-rust-dsp"
    schedule:
      interval: "weekly"
    # One PR per action keeps a compromised-upstream bump reviewable in
    # isolation; a batched PR is exactly where a bad SHA slips through.
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"

  - package-ecosystem: "npm"
    directory: "/desktop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      desktop-patch-and-minor:
        update-types:
          - "patch"
          - "minor"
    commit-message:
      prefix: "fix(desktop)"
    labels:
      - "dependencies"
      - "security"
