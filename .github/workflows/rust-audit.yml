name: Rust Security Audit

# Gate added for #4360: the vendored Rust DSP crate (vendor/auralis-dsp) is the
# PyO3 trust boundary between untrusted audio data and native code, yet had no
# advisory scan — a future RUSTSEC advisory against a pinned crate would go
# unnoticed. This runs `cargo audit` against the crate's Cargo.lock on every
# push/PR that touches it, and weekly, and FAILS the job on any security
# vulnerability. Unmaintained/yanked warnings are reported but non-blocking.
#
# See vendor/auralis-dsp/UPGRADE_PLAN.md for the pyo3/ndarray/numpy
# version-bump plan.

on:
  push:
    branches: [master]
    paths:
      # Cargo.lock is tracked as of #4531 — a lockfile-only bump (dependency
      # update with no Cargo.toml change) must still trigger the audit.
      - 'vendor/auralis-dsp/Cargo.toml'
      - 'vendor/auralis-dsp/Cargo.lock'
      - '.github/workflows/rust-audit.yml'
  pull_request:
    paths:
      - 'vendor/auralis-dsp/Cargo.toml'
      - 'vendor/auralis-dsp/Cargo.lock'
      - '.github/workflows/rust-audit.yml'
  schedule:
    # Weekly (Mon 06:00 UTC) so a newly-published advisory against an unchanged
    # Cargo.lock is still caught even when nobody touches the crate.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        # #4531: dtolnay/rust-toolchain@stable ignores rust-toolchain.toml and
        # floats on whatever "stable" resolves to that day. Read the pin here
        # so the action installs the exact version the lockfile was built
        # against, instead of drifting independently of it.
        run: |
          version=$(grep -m1 '^channel' vendor/auralis-dsp/rust-toolchain.toml | cut -d '"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08-14
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.version }}

      - name: Install cargo-audit
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-audit

      - name: Verify Cargo.lock is up to date (#4531)
        # Cargo.lock is now tracked (git add -f'd — it ships in the desktop
        # installer, so the resolved graph must be reproducible from a git
        # checkout). --locked fails the build instead of silently
        # re-resolving if Cargo.toml and the committed lockfile diverge.
        run: cargo metadata --locked --manifest-path vendor/auralis-dsp/Cargo.toml --format-version 1 > /dev/null

      - name: Audit vendored Rust DSP crate
        # --file targets the crate's own lockfile (not the repo root). Default
        # exit is non-zero on any security vulnerability, failing the build.
        #
        # No advisories are ignored. The pyo3 0.23 ignores (RUSTSEC-2025-0020,
        # RUSTSEC-2026-0177) were dropped when the crate moved to pyo3 0.29
        # (#5485); keep this list empty unless an advisory is both unreachable
        # and unfixable, and record why here if so.
        run: cargo audit --file vendor/auralis-dsp/Cargo.lock
