name: Requirements Pin Guard

# #4343: auralis-web/backend/requirements.txt is rsync'd verbatim into the
# shipped desktop app (see .github/workflows/build-release.yml). If the
# untrusted-audio parsing stack (numpy, scipy, soundfile, mutagen) in that
# file ever drifts back to unpinned, the shipped build resolves whatever is
# on PyPI at build time instead of the vetted, reproducible pins in the root
# requirements.txt.
#
# #4561: the sensitive-package loop below only ever inspected four packages, so
# it passed green while `uvicorn` vs `uvicorn[standard]` diverged between the two
# manifests — meaning dev/CI ran the pure-Python asyncio loop and users got
# uvloop + httptools. Both files' headers already claim they must mirror each
# other; the mirror job below turns that documentation promise into a gate that
# catches ANY divergence, not just drift in four hand-picked packages.
#
# #4528: neither of the jobs above looked at pyproject.toml, which had drifted
# so far off requirements.txt that `pip install -e .` produced an environment
# that could not import `auralis.library` — SQLAlchemy was simply absent, along
# with 8 other runtime deps — while declaring four packages (PyQt6 among them)
# with zero importers repo-wide. The pyproject-matches-requirements job below
# closes that third gap.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  manifests-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Verify the shipped manifest mirrors the root manifest
        run: |
          set -euo pipefail
          root=requirements.txt
          shipped=auralis-web/backend/requirements.txt

          for f in "$root" "$shipped"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing manifest: $f"
              exit 1
            fi
          done

          # Compare requirement lines only: strip comments, blank lines and
          # leading/trailing whitespace, then sort so ordering and section
          # grouping may differ between the two files.
          extract() {
            sed -e 's/[[:space:]]*#.*$//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' "$1" \
              | grep -E '^[a-zA-Z]' \
              | sort
          }

          if ! diff -u <(extract "$root") <(extract "$shipped") \
                 --label "$root" --label "$shipped" > /tmp/manifest.diff; then
            echo "::error file=$shipped::Requirement lines diverge from $root (#4561)"
            echo "The two manifests must be identical — $shipped is rsync'd into"
            echo "the shipped desktop app, so any divergence means users run"
            echo "different dependencies from dev and CI (#4343)."
            echo "To update: change $root first, then copy its pins across."
            echo
            cat /tmp/manifest.diff
            exit 1
          fi
          echo "OK: $shipped mirrors $root."

  desktop-manifest-derives-from-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Verify requirements-desktop.txt only references the root manifest
        run: |
          set -euo pipefail
          desktop=requirements-desktop.txt

          if [ ! -f "$desktop" ]; then
            echo "::error::Missing manifest: $desktop"
            exit 1
          fi

          # #4355: this file used to restate its own floating floors
          # (numpy>=1.23.4 against a root numpy==2.3.5) plus a statsmodels entry
          # the root manifest records as unused, so which manifest governed an
          # install decided which versions you got. It is now a `-r` reference,
          # and the mirror job above cannot catch a regression here because
          # this file is not one of the two it compares.
          direct=$(sed -e 's/[[:space:]]*#.*$//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' "$desktop" \
            | grep -E '^[a-zA-Z]' || true)

          if [ -n "$direct" ]; then
            echo "::error file=$desktop::Direct requirement lines are not allowed here (#4355)"
            echo "This manifest must derive from requirements.txt via '-r', not restate pins:"
            echo "$direct"
            exit 1
          fi

          if ! grep -qE '^\s*-r\s+requirements\.txt\s*$' "$desktop"; then
            echo "::error file=$desktop::Must contain '-r requirements.txt' (#4355)"
            exit 1
          fi
          echo "OK: $desktop derives from requirements.txt."

  pyproject-matches-requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Verify pyproject.toml declares the same runtime dependency set
        run: python .github/scripts/check_pyproject_deps.py

  pinned-parser-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Verify sensitive parser packages are == pinned
        run: |
          set -euo pipefail
          pin_status=0
          # Sensitive: parses untrusted audio/metadata files directly. Kept as a
          # separate job from the mirror check above: the two manifests being
          # identical does not by itself mean they are ==-pinned (#4343).
          for pkg in numpy scipy soundfile mutagen; do
            line=$(grep -iE "^${pkg}([<>=~!\[ ]|$)" auralis-web/backend/requirements.txt || true)
            if [ -z "$line" ]; then
              echo "::error file=auralis-web/backend/requirements.txt::Missing entry for '$pkg'"
              pin_status=1
            elif ! echo "$line" | grep -qE '==[0-9]'; then
              echo "::error file=auralis-web/backend/requirements.txt::'$line' is not ==-pinned (#4343)"
              pin_status=1
            fi
          done
          if [ "$pin_status" -ne 0 ]; then
            echo "Pin every sensitive parser package with == in auralis-web/backend/requirements.txt (mirror root requirements.txt)."
            exit 1
          fi
          echo "OK: numpy/scipy/soundfile/mutagen are all ==-pinned in the shipped manifest."
