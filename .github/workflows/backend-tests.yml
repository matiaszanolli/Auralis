name: Backend Tests

# Gate added for #4562. No workflow had ever run pytest: five tracked files sat
# in `.github/workflows.backup/` whose README described them in the present
# tense as the active pipeline (backend tests, linting, Codecov), but GitHub
# only executes `.github/workflows/`, so none of them ran. This is the pytest
# counterpart of `frontend-test.yml` (#4640).
#
# Ratchet, not a green-suite demand: `scripts/check_pytest_baseline.py` compares
# the run against the checked-in `pytest-baseline.json` and fails only on
# failures that are NOT already known. The baseline can shrink but never grow.
# Once it reaches zero, replace the baseline step with a plain pytest invocation.
#
# tests/concurrency/test_thread_safety.py used to be excluded for the same
# reason (#5095): two unbounded waits -- a threading.Barrier.wait() with no
# timeout in tests/concurrency/helpers.py::run_concurrent_with_barrier, and
# an inline test's raw threading.Thread.join(timeout=30) that didn't check
# whether the thread was still alive afterward -- meant a single thread that
# failed to reach the barrier (e.g. Thread.start() raising RuntimeError
# under OS thread-limit pressure from earlier tests' own non-daemon
# threads) permanently stranded every other thread already waiting, with no
# way for the helper or its caller to ever notice. Both now bound their
# waits and mark threads daemon=True so a residual hang can't block process
# exit. The file now completes in ~6s (verified stable across repeated
# runs) instead of hanging indefinitely.
#
# tests/backend/test_system_api.py used to be excluded for the same reason
# (#4781): the `client` fixture's websocket_connect() defaulted the Origin
# header to a Vite dev-server URL that ALLOWED_WS_ORIGINS only allows in dev
# mode, and several tests asserted on the first frame received without
# draining the unsolicited enhancement_settings_changed/player_state sync
# frames every `/ws` connection sends on accept — leaving those frames
# unread in the connection's queue past test teardown wedged the next test.
# Both root causes are fixed; the file now completes in ~4s.

on:
  push:
    branches: [master]
    paths:
      - 'auralis/**'
      - 'auralis-web/backend/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-lock.txt'
      - 'pytest.ini'
      - 'pytest-baseline.json'
      - 'scripts/check_pytest_baseline.py'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'auralis/**'
      - 'auralis-web/backend/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-lock.txt'
      - 'pytest.ini'
      - 'pytest-baseline.json'
      - 'scripts/check_pytest_baseline.py'
      - '.github/workflows/backend-tests.yml'

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    # The cap exists so a spec that hangs the runner fails the job instead of
    # burning the whole allowance -- not to keep the suite fast. It isn't:
    # the "~7 minutes locally" claim this comment used to make was stale.
    # Recent completed CI runs already took ~20-21 minutes at 30 (run
    # 31961589789: 20m42s; 31960984507: 21m21s; 31959998496: 19m27s -- all
    # before #5095 restored test_thread_safety.py, which itself only adds a
    # fraction of a second). #5089's Origin-header fix is the real driver:
    # many tests that used to fail instantly on a 403 before reaching the
    # route now execute the real handler for the first time -- genuine audio
    # decode attempts, DSP calls, filesystem I/O -- which costs real wall
    # time that a short-circuited 403 never did. Runs 32252354656 and
    # 32259315272 hit exactly this, each cancelled by the 30-minute cap --
    # the former at 83% around the 30-minute mark despite
    # test_thread_safety.py itself completing in under a second mid-run.
    # 45 restores comfortable margin for a suite whose real work grew.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Must match `.python-version` (3.14) and pyproject's
      # `requires-python = ">=3.14"`. On 3.13 the whole suite fails to
      # collect: the codebase relies on PEP 649 deferred annotations, so a
      # self-referential return type evaluated at class-definition time —
      # e.g. `FingerprintUnpacker.from_dict(...) -> FingerprintUnpacker` —
      # raises `NameError: name 'FingerprintUnpacker' is not defined` on
      # 3.13 without `from __future__ import annotations`. Pinning 3.13 here
      # produced 13 collection errors and 0 tests run on every push.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # --require-hashes (#4889): requirements.txt's == pins cover only
          # direct dependencies — nothing hash-verified or version-pinned
          # the transitive tree, so a fresh install resolved whatever
          # transitive versions PyPI served at install time. requirements-
          # lock.txt hash-locks the full tree (see its own header for the
          # regeneration command); --require-hashes makes pip refuse to
          # install anything that doesn't match a listed hash.
          pip install --require-hashes -r requirements-lock.txt
          # pytest MUST stay at 9.0.x: 9.1 removed the legacy
          # pytest_ignore_collect(path, config) hook signature that
          # tests/conftest.py still uses, which crashes collection entirely.
          pip install 'pytest==9.0.1' pytest-asyncio pytest-timeout httpx2

      # Always exits 0 — a failing suite is expected while the baseline is
      # non-empty. The baseline check below is what decides the job.
      - name: Run pytest
        run: |
          python -m pytest -q -m "not slow" -p no:randomly \
            --junitxml=pytest-results.xml || true

      # Fails the job on any failure not present in pytest-baseline.json, and
      # also fails if the report is missing or reports 0 collected tests, so a
      # crashed runner cannot pass as green. --strict-stale (#5091) also fails
      # on a baseline entry that ran and passed -- the other half of the
      # ratchet, since a stale entry silently re-permits its exact failure if
      # that test ever regresses. Off until now: turning it on before the
      # baseline was regenerated from a real CI artifact (commit f59b4901
      # did the detection tooling but explicitly left the regeneration and
      # this flag for later) would have failed every run immediately on the
      # 241 stale entries that had already accumulated.
      - name: Compare against known-failure baseline
        run: python scripts/check_pytest_baseline.py pytest-results.xml --strict-stale

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-results
          path: pytest-results.xml
          retention-days: 7
