name: Backend Tests

# Gate added for #4562. No workflow had ever run pytest: five tracked files sat
# in `.github/workflows.backup/` whose README described them in the present
# tense as the active pipeline (backend tests, linting, Codecov), but GitHub
# only executes `.github/workflows/`, so none of them ran. This is the pytest
# counterpart of `frontend-test.yml` (#4640).
#
# Ratchet, not a green-suite demand: `scripts/check_pytest_baseline.py` compares
# the run against the checked-in `pytest-baseline.json` and fails only on
# failures that are NOT already known. The baseline can shrink but never grow.
# Once it reaches zero, replace the baseline step with a plain pytest invocation.
#
# tests/concurrency/test_thread_safety.py used to be excluded for the same
# reason (#5095): two unbounded waits -- a threading.Barrier.wait() with no
# timeout in tests/concurrency/helpers.py::run_concurrent_with_barrier, and
# an inline test's raw threading.Thread.join(timeout=30) that didn't check
# whether the thread was still alive afterward -- meant a single thread that
# failed to reach the barrier (e.g. Thread.start() raising RuntimeError
# under OS thread-limit pressure from earlier tests' own non-daemon
# threads) permanently stranded every other thread already waiting, with no
# way for the helper or its caller to ever notice. Both now bound their
# waits and mark threads daemon=True so a residual hang can't block process
# exit. The file now completes in ~6s (verified stable across repeated
# runs) instead of hanging indefinitely.
#
# tests/backend/test_system_api.py used to be excluded for the same reason
# (#4781): the `client` fixture's websocket_connect() defaulted the Origin
# header to a Vite dev-server URL that ALLOWED_WS_ORIGINS only allows in dev
# mode, and several tests asserted on the first frame received without
# draining the unsolicited enhancement_settings_changed/player_state sync
# frames every `/ws` connection sends on accept — leaving those frames
# unread in the connection's queue past test teardown wedged the next test.
# Both root causes are fixed; the file now completes in ~4s.

on:
  push:
    branches: [master]
    paths:
      - 'auralis/**'
      - 'auralis-web/backend/**'
      # The WS message-type registry is a frontend file, but
      # tests/backend/test_ws_type_registry_drift_4680.py reads it to check the
      # backend's emitted literals against it (#4680). Without this entry the
      # drift check would not run for the one change most likely to break it.
      - 'auralis-web/frontend/src/types/ws/**'
      - 'auralis-web/frontend/vite.config.mts'
      - 'auralis-web/frontend/pnpm-lock.yaml'
      - 'launch-auralis-web.py'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-lock.txt'
      - 'pytest.ini'
      - 'pytest-baseline.json'
      - 'scripts/check_pytest_baseline.py'
      # The Rust module is built in this job (#6657), so a Rust-only change
      # must run the Python gate that exercises it.
      - 'vendor/auralis-dsp/**'
      - 'requirements-build.txt'
      - '.github/actions/build-rust-dsp/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'auralis/**'
      - 'auralis-web/backend/**'
      # The WS message-type registry is a frontend file, but
      # tests/backend/test_ws_type_registry_drift_4680.py reads it to check the
      # backend's emitted literals against it (#4680). Without this entry the
      # drift check would not run for the one change most likely to break it.
      - 'auralis-web/frontend/src/types/ws/**'
      - 'auralis-web/frontend/vite.config.mts'
      - 'auralis-web/frontend/pnpm-lock.yaml'
      - 'launch-auralis-web.py'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-lock.txt'
      - 'pytest.ini'
      - 'pytest-baseline.json'
      - 'scripts/check_pytest_baseline.py'
      # The Rust module is built in this job (#6657), so a Rust-only change
      # must run the Python gate that exercises it.
      - 'vendor/auralis-dsp/**'
      - 'requirements-build.txt'
      - '.github/actions/build-rust-dsp/**'
      - '.github/workflows/backend-tests.yml'

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    # The cap exists so a spec that hangs the runner fails the job instead of
    # burning the whole allowance -- not to keep the suite fast. It isn't:
    # the "~7 minutes locally" claim this comment used to make was stale.
    # Recent completed CI runs already took ~20-21 minutes at 30 (run
    # 31961589789: 20m42s; 31960984507: 21m21s; 31959998496: 19m27s -- all
    # before #5095 restored test_thread_safety.py, which itself only adds a
    # fraction of a second). #5089's Origin-header fix is the real driver:
    # many tests that used to fail instantly on a 403 before reaching the
    # route now execute the real handler for the first time -- genuine audio
    # decode attempts, DSP calls, filesystem I/O -- which costs real wall
    # time that a short-circuited 403 never did. Runs 32252354656 and
    # 32259315272 hit exactly this, each cancelled by the 30-minute cap --
    # the former at 83% around the 30-minute mark despite
    # test_thread_safety.py itself completing in under a second mid-run.
    # 45 restores comfortable margin for a suite whose real work grew.
    # Run 44234238821 still spent 40 of those minutes in pytest; ~23 of them
    # were tests/performance, load_stress and stress, which now run nightly
    # in slow-tests.yml instead (#6708).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Must match `.python-version` (3.14) and pyproject's
      # `requires-python = ">=3.14"`. On 3.13 the whole suite fails to
      # collect: the codebase relies on PEP 649 deferred annotations, so a
      # self-referential return type evaluated at class-definition time —
      # e.g. `FingerprintUnpacker.from_dict(...) -> FingerprintUnpacker` —
      # raises `NameError: name 'FingerprintUnpacker' is not defined` on
      # 3.13 without `from __future__ import annotations`. Pinning 3.13 here
      # produced 13 collection errors and 0 tests run on every push.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: 'pip'

      # The app decodes and probes non-native formats through ffmpeg/ffprobe,
      # and the probe tests (protocol guard, duration cap, argv whitelist,
      # stderr redaction) drive the real binaries. ubuntu-latest has neither,
      # so those tests failed on "FFmpeg not found" (#6709).
      - name: Install FFmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # --require-hashes (#4889): requirements.txt's == pins cover only
          # direct dependencies — nothing hash-verified or version-pinned
          # the transitive tree, so a fresh install resolved whatever
          # transitive versions PyPI served at install time. requirements-
          # lock.txt hash-locks the full tree (see its own header for the
          # regeneration command); --require-hashes makes pip refuse to
          # install anything that doesn't match a listed hash.
          pip install --require-hashes -r requirements-lock.txt
          # Exact pin for baseline reproducibility, not compatibility:
          # pytest-baseline.json records failures observed at this version,
          # and a baseline judged under a different dependency set reports
          # spurious new failures. 9.0.1 satisfies pyproject's dev floor
          # (`pytest>=9.0.1`). The old 9.0.x ceiling is gone (#4529 deleted
          # the legacy pytest_ignore_collect hook that needed it; collection
          # is verified on 9.1.1), so bumping is safe — but regenerate
          # pytest-baseline.json from that run's CI artifact in the same change.
          pip install 'pytest==9.0.1' pytest-asyncio pytest-timeout httpx2

      # The 25D fingerprint is the one compiled module on the analysis path, and
      # CLAUDE.md lists Rust as required. Without it ~200 tests fail with
      # FingerprintUnavailable and every importorskip("auralis_dsp") test skips,
      # so the baseline recorded the absence as if it were real failures (#6657).
      - name: Build the Rust DSP module
        uses: ./.github/actions/build-rust-dsp

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: auralis-web/frontend/pnpm-lock.yaml

      - name: Install the frontend for the isolated startup smoke
        working-directory: auralis-web/frontend
        run: pnpm install --frozen-lockfile

      # Always exits 0 — a failing suite is expected while the baseline is
      # non-empty. The baseline check below is what decides the job.
      - name: Run pytest
        run: |
          # --durations: a run that nears the cap must show which tests ate
          # it (#6706); without this the only evidence was gaps between log
          # timestamps.
          python -m pytest -q -m "not slow" -p no:randomly --durations=25 \
            --junitxml=pytest-results.xml || true

      # Fails the job on any failure not present in pytest-baseline.json, and
      # also fails if the report is missing or reports 0 collected tests, so a
      # crashed runner cannot pass as green. --strict-stale (#5091) also fails
      # on a baseline entry that ran and passed -- the other half of the
      # ratchet, since a stale entry silently re-permits its exact failure if
      # that test ever regresses. Off until now: turning it on before the
      # baseline was regenerated from a real CI artifact (commit f59b4901
      # did the detection tooling but explicitly left the regeneration and
      # this flag for later) would have failed every run immediately on the
      # 241 stale entries that had already accumulated.
      - name: Compare against known-failure baseline
        run: python scripts/check_pytest_baseline.py pytest-results.xml --strict-stale

      # A job-level timeout cancels the pytest step, and every step after it
      # is then skipped -- the baseline check included -- so the run used to
      # end as a bare "cancelled" with no verdict (#6706). This step only runs
      # in that case and puts the cause in an error annotation on the run. The
      # job's own conclusion may still read "cancelled" -- GitHub decides that.
      - name: Fail loudly when pytest did not finish
        if: cancelled()
        run: |
          echo "::error title=No pytest verdict::pytest did not finish within the job's timeout-minutes cap, so pytest-results.xml was never written and the known-failure baseline was not checked. Read the 'slowest durations' of a completed run and fix the slow tests; do not just raise the cap (#6706)."
          exit 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-results
          path: pytest-results.xml
          retention-days: 7
          if-no-files-found: warn

  # The ratchets below read the source tree, not the junit report, and need
  # only the standard library (the ruff step fetches a pinned ruff via pipx).
  # They lived as steps of the `pytest` job, so a pytest run that was
  # cancelled at the cap skipped all of them (#6706). As their own job they
  # run, and report, whatever pytest does.
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      # Ratchet gate for tests whose only assertions are `X is not None`
      # (#5154). The script existed and ran correctly standalone but nothing
      # in CI ever invoked it (#5224) — the same "checker with no caller"
      # shape #5091 fixed for pytest-baseline.json. Scans the test tree
      # directly, independent of the junit report.
      - name: Check for new weak-assertion tests
        run: python scripts/check_weak_assertions.py

      # Same ratchet for tests with no assertion at all (#5807): a body that
      # ends in "this test documents expected behavior" passes against any
      # defect. The legitimate "does not raise" tests are baselined.
      # `if: !cancelled()` on each step so one failing gate does not hide the
      # verdict of the ones after it.
      - name: Check for new zero-assertion tests
        if: ${{ !cancelled() }}
        run: python scripts/check_weak_assertions.py --zero

      # Split targets that were closed under 300 lines and kept regrowing
      # (#5830); loc-ceilings.json holds the line count each may not exceed.
      - name: Check split targets did not regrow
        if: ${{ !cancelled() }}
        run: python scripts/check_loc_ratchet.py

      # 'was removed in #NNNN' history comments regrew after every manual
      # sweep (#6257); the git log already carries the history.
      - name: Check for breadcrumb comments
        if: ${{ !cancelled() }}
        run: python scripts/check_breadcrumbs.py

      # Unused imports/locals regrew after every module split (#6209; #6604-#6607
      # found ~70): the ruff pre-commit hook only runs in a checkout that
      # installed it. Same version and rules as .pre-commit-config.yaml.
      - name: Check for unused imports and locals
        if: ${{ !cancelled() }}
        run: pipx run ruff==0.12.12 check --no-cache --select F401,F811,F841 auralis auralis-web/backend scripts tools
