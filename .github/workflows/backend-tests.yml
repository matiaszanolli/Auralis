name: Backend Tests

# Gate added for #4562. No workflow had ever run pytest: five tracked files sat
# in `.github/workflows.backup/` whose README described them in the present
# tense as the active pipeline (backend tests, linting, Codecov), but GitHub
# only executes `.github/workflows/`, so none of them ran. This is the pytest
# counterpart of `frontend-test.yml` (#4640).
#
# Ratchet, not a green-suite demand: `scripts/check_pytest_baseline.py` compares
# the run against the checked-in `pytest-baseline.json` and fails only on
# failures that are NOT already known. The baseline can shrink but never grow.
# Once it reaches zero, replace the baseline step with a plain pytest invocation.
#
# One file is excluded because it HANGS when run as a whole file rather than
# as scoped classes — it would burn the runner's whole allowance instead of
# failing. Removing an exclusion requires fixing the hang first:
#   tests/concurrency/test_thread_safety.py
#
# tests/backend/test_system_api.py used to be excluded for the same reason
# (#4781): the `client` fixture's websocket_connect() defaulted the Origin
# header to a Vite dev-server URL that ALLOWED_WS_ORIGINS only allows in dev
# mode, and several tests asserted on the first frame received without
# draining the unsolicited enhancement_settings_changed/player_state sync
# frames every `/ws` connection sends on accept — leaving those frames
# unread in the connection's queue past test teardown wedged the next test.
# Both root causes are fixed; the file now completes in ~4s.

on:
  push:
    branches: [master]
    paths:
      - 'auralis/**'
      - 'auralis-web/backend/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-lock.txt'
      - 'pytest.ini'
      - 'pytest-baseline.json'
      - 'scripts/check_pytest_baseline.py'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'auralis/**'
      - 'auralis-web/backend/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-lock.txt'
      - 'pytest.ini'
      - 'pytest-baseline.json'
      - 'scripts/check_pytest_baseline.py'
      - '.github/workflows/backend-tests.yml'

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    # The suite takes ~7 minutes locally; the cap exists so a spec that hangs
    # the runner fails the job instead of burning the whole allowance.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Must match `.python-version` (3.14) and pyproject's
      # `requires-python = ">=3.14"`. On 3.13 the whole suite fails to
      # collect: the codebase relies on PEP 649 deferred annotations, so a
      # self-referential return type evaluated at class-definition time —
      # e.g. `FingerprintUnpacker.from_dict(...) -> FingerprintUnpacker` —
      # raises `NameError: name 'FingerprintUnpacker' is not defined` on
      # 3.13 without `from __future__ import annotations`. Pinning 3.13 here
      # produced 13 collection errors and 0 tests run on every push.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # --require-hashes (#4889): requirements.txt's == pins cover only
          # direct dependencies — nothing hash-verified or version-pinned
          # the transitive tree, so a fresh install resolved whatever
          # transitive versions PyPI served at install time. requirements-
          # lock.txt hash-locks the full tree (see its own header for the
          # regeneration command); --require-hashes makes pip refuse to
          # install anything that doesn't match a listed hash.
          pip install --require-hashes -r requirements-lock.txt
          # pytest MUST stay at 9.0.x: 9.1 removed the legacy
          # pytest_ignore_collect(path, config) hook signature that
          # tests/conftest.py still uses, which crashes collection entirely.
          pip install 'pytest==9.0.1' pytest-asyncio pytest-timeout httpx2

      # Always exits 0 — a failing suite is expected while the baseline is
      # non-empty. The baseline check below is what decides the job.
      - name: Run pytest
        run: |
          python -m pytest -q -m "not slow" -p no:randomly \
            --ignore=tests/concurrency/test_thread_safety.py \
            --junitxml=pytest-results.xml || true

      # Fails the job on any failure not present in pytest-baseline.json, and
      # also fails if the report is missing or reports 0 collected tests, so a
      # crashed runner cannot pass as green.
      - name: Compare against known-failure baseline
        run: python scripts/check_pytest_baseline.py pytest-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-results
          path: pytest-results.xml
          retention-days: 7
