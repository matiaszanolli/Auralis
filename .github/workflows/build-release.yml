name: Verify Apple Silicon startup

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version of the existing DMG to verify
        required: true
        default: '1.5.1'

permissions:
  actions: read
  contents: read

jobs:
  verify-macos:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: macos-arm64-binary
          run-id: 45664320586
          github-token: ${{ github.token }}
          path: candidate
      - name: Install and verify the packaged app
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          sw_vers
          dmg="candidate/Auralis-${RELEASE_VERSION}-arm64.dmg"
          echo "30f28448d4ad82a564420c26cdf0e693609a4b125eee316b3a7eda98ccd96d88  $dmg" | shasum -a 256 -c
          python3 .github/macos-startup-smoke.py "$dmg" "$RELEASE_VERSION"
