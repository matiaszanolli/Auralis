name: Frontend Type Check

# Gate added for #4143: the frontend had 43 production `tsc` errors that
# shipped undetected because no CI job ran the type-checker. This workflow
# runs the production-scoped type-check (`tsconfig.build.json`, which excludes
# test files) on every push and pull request and FAILS the job on any error,
# so production type errors can no longer regress silently.
#
# Test-file type errors are intentionally out of scope of this blocking gate
# for now (tracked separately); extend `tsconfig.build.json`'s excludes / add a
# `type-check` (full) step once those are cleared.

on:
  push:
    branches: [master]
    paths:
      - 'auralis-web/frontend/**'
      - '.github/workflows/frontend-typecheck.yml'
  pull_request:
    paths:
      - 'auralis-web/frontend/**'
      - '.github/workflows/frontend-typecheck.yml'

permissions:
  contents: read

jobs:
  type-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auralis-web/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version:` key — see frontend-test.yml. Specifying one alongside the
      # `packageManager` field in package.json makes action-setup hard-error,
      # which had silently disabled this gate too.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: auralis-web/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type-check (production)
        run: pnpm run type-check:prod
