repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-toml

  # Unused imports/locals/redefinitions (#5781). Ruff was only run by hand
  # (#4888, #5209, #5781 were three separate sweeps of the same drift), so
  # nothing stopped them accumulating. Scoped to the shipped Python trees and
  # to the three rules that are always safe to fix.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.12
    hooks:
      - id: ruff
        args: ["--select", "F401,F811,F841"]
        files: ^(auralis|auralis-web/backend)/

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/pycqa/isort
    rev: 8.0.1
    hooks:
      - id: isort
        args: ["--profile", "black"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        additional_dependencies: [types-psutil]

  - repo: https://github.com/pycqa/pylint
    rev: v4.0.6
    hooks:
      - id: pylint
        args: [
          "--disable=C0111",  # missing-docstring
        ]
        additional_dependencies: [pylint-pytest, psutil]
