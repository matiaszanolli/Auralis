[pytest]
# Pytest configuration for Matchering
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = auralis-web/backend

# Exclude directories
norecursedirs = tests/validation tests/obsolete .git __pycache__ build dist *.egg-info

# Test discovery patterns
addopts =
    --verbose
    --tb=short
    --strict-markers
    --strict-config
# NOTE: do NOT re-add --disable-warnings (#4559). It suppresses the warnings
# summary, which made `filterwarnings = default::DeprecationWarning` below inert
# and left the project blind to its own deliberate migration signals — including
# LibraryManager's "will be removed in v2.0.0", which fired invisibly on every
# single test run. Silence specific noise with a narrowly-scoped `ignore::`
# entry in filterwarnings instead of a blanket suppression.

# Markers for organizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests across components
    boundary: Boundary condition and edge case tests
    e2e: End-to-end integration tests
    invariant: Invariant tests (properties that must always hold)
    fast: Fast tests (< 100ms) - run in CI
    slow: Tests that take a long time to run (> 1s) - run nightly
    audio: Tests that require audio processing
    files: Tests that require file I/O
    player: Tests for the matchering player
    core: Tests for the core matchering library
    dsp: Tests for DSP functionality
    library: Tests for library management
    playlist: Tests for playlist operations
    api: Tests for API endpoints
    artwork: Tests for artwork management
    metadata: Tests for metadata operations
    performance: Performance and benchmark tests
    realtime: Real-time processing performance tests
    cache: Cache effectiveness tests
    database: Database query performance tests
    optimization: Optimization validation tests
    benchmark: Long-running benchmark tests
    security: Security tests (SQL injection, path traversal, etc.)
    validation: Input validation and data integrity tests
    resilience: Error recovery and resilience tests
    memory: Memory leak detection tests
    regression: Regression tests
    mutation: Mutation testing (tests designed to kill specific mutations)
    load: Load testing (large datasets, high volume operations)
    stress: Stress testing (resource limits, extreme conditions)
    error: Error handling and edge case tests
    edge_case: Edge case tests (extreme conditions, failures)
    edge_cases: Edge case tests (deprecated, use edge_case)
    concurrency: Concurrency and thread-safety tests
    thread_safety: Thread-safety specific tests
    parallel: Parallel processing tests
    async_test: Async operation tests
    empty: Tests for empty collections
    single: Tests for single-item collections
    exact: Tests for exact boundary conditions
    extreme: Tests for maximum/minimum values

# Minimum version requirements (#4559)
# 9.0.1 is what the suite actually requires, not the historical 6.0:
# pytest 9.1 removed the legacy pytest_ignore_collect(path, config) hook
# signature that tests/conftest.py still uses, which crashes collection
# outright. Keep this in sync with the pytest pin in pyproject.toml.
minversion = 9.0.1

# Test timeout (in seconds)
timeout = 300

# Filters for warnings
filterwarnings =
    default::DeprecationWarning
    ignore::DeprecationWarning:pyaudio
    ignore::DeprecationWarning:soundfile
    ignore::PendingDeprecationWarning
    ignore::UserWarning:.*PyAudio.*
    ignore::UserWarning:.*soundfile.*
    ignore::UserWarning:.*PortAudio.*
    ignore:.*PortAudio not initialized.*:UserWarning
    ignore:.*Error terminating PortAudio.*:UserWarning

# Third-party noise triaged when --disable-warnings was removed (#4559).
# Each is out of this project's control and recurs on every run; first-party
# warnings (auralis.*, tests/conftest.py) are deliberately NOT filtered — making
# them visible is the entire point of that change.
    # audioread pulls in vendored 'standard-aifc'/'standard-chunk' because
    # CPython 3.13 dropped those stdlib modules. Reached only through librosa's
    # decode fallback; nothing here can act on it.
    ignore:.*was removed in Python 3\.13.*separately installed.*:DeprecationWarning
    # librosa falls back to audioread whenever soundfile cannot open a format
    # (our synthetic test fixtures hit this), then warns about its own
    # deprecated fallback. Both are librosa-internal.
    ignore:.*PySoundFile failed.*:UserWarning
    ignore:.*__audioread_load.*:FutureWarning

# Coverage options (if pytest-cov is installed)
[coverage:run]
branch = true
omit =
    */site-packages/*
    */distutils/*
    */__pycache__/*
    */tests/*
    setup.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
precision = 2

# Minimum coverage requirement
fail_under = 85